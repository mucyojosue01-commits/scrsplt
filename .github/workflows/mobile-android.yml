name: DualView Mobile Android

on:
  push:
    branches: [main, "feature/dualview-mobile-separated-app"]
    paths:
      - "mobile-android/**"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    paths:
      - "mobile-android/**"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:

jobs:
  build-mobile-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build DualView Mobile
        working-directory: mobile-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: DualView-Mobile-Android-Debug
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
