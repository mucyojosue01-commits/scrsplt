name: Build Android companion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-build.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug APK
        run: gradle --no-daemon :android:assembleDebug
      - name: Verify APK output
        shell: bash
        run: |
          test -s android/build/outputs/apk/debug/android-debug.apk || find android/build/outputs/apk -type f -name '*.apk' -print
          APK=$(find android/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/DualView-Android-Companion.apk
          sha256sum artifacts/DualView-Android-Companion.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DualView-Android-APK
          path: artifacts/DualView-Android-Companion.apk
          if-no-files-found: error
          retention-days: 30
